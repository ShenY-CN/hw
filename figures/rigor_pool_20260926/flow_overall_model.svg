   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Heiti SC', sans-serif; text-anchor: middle; fill: #213547" x="421.2" y="37.74" transform="rotate(-0 421.2 37.74)">山区无人机运输—通信—分区配置证据链</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Heiti SC', sans-serif; text-anchor: start; fill: #315e9d" x="61.02" y="104.86" transform="rotate(-0 61.02 104.86)">统一输入与物理回放</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(61.02 129.185656)">80箱 / 15服务区 / DEM</text>
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(61.02 140.071156)">载荷—能耗、硬时限</text>
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(61.02 151.173828)">机体、电池与充电占用</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Heiti SC', sans-serif; text-anchor: start; fill: #258a91" x="338.4" y="104.86" transform="rotate(-0 338.4 104.86)">Q1  单点直送DP</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(338.4 129.021656)">枚举可行批次模式</text>
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(338.4 140.0135)">Bellman词典序转移</text>
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(338.4 151.161656)">限定模型内精确最优</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Heiti SC', sans-serif; text-anchor: start; fill: #b64a60" x="615.78" y="104.86" transform="rotate(-0 615.78 104.86)">Q2  两层VRPTW调度</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(615.78 129.058172)">路线列启发式 → 固定路线CP-SAT</text>
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(615.78 140.058984)">共享24架次warm-start</text>
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(615.78 151.116172)">4法×10种子×固定3评估</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Heiti SC', sans-serif; text-anchor: start; fill: #69549a" x="127.26" y="251.02" transform="rotate(-0 127.26 251.02)">Q3  连续通信子问题</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(127.26 275.325156)">区间距离/遮挡上界证书</text>
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(127.26 286.226672)">同一中继：接入与回程同时成立</text>
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(127.26 297.337672)">32个有限候选，返回可行性与裕度</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Heiti SC', sans-serif; text-anchor: start; fill: #ce853d" x="475.02" y="251.02" transform="rotate(-0 475.02 251.02)">有限分解协调边界</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(475.02 275.173328)">运输族 + 中继窗口 → 连续证书</text>
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(475.02 286.198484)">当前无通信冲突割回传接口</text>
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(475.02 297.333828)">不宣称强联合或全局最优</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Heiti SC', sans-serif; text-anchor: start; fill: #315e9d" x="193.5" y="407.26" transform="rotate(-0 193.5 407.26)">Q4  固定Q3任务的两组/三组分区</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(193.5 431.396672)">不可拆组件 → 事件时刻资源峰值 → 穷举分组</text>
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(193.5 442.434)">分别报告 duplicated（重复配置）、unused（库存闲置）、deficit（库存缺口）</text>
    <text style="font-size: 8.2px; font-family: 'Heiti SC', sans-serif; fill: #263442" transform="translate(193.5 453.545)">最终逐箱、逐航次、逐资源、逐通信区间回放验收</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.5px; font-family: 'Heiti SC', sans-serif; text-anchor: middle; fill: #536273" x="421.2" y="498.6" transform="rotate(-0 421.2 498.6)">结论边界：小协议未发现新Pareto点；结果是可执行见证，不是全局最优证明</text>
   </g>
  </g>
 </g>
